<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="titulo">
  <title id="titulo">Proyecto de software</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#111c44"/>
    </linearGradient>
    <pattern id="puntos" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" opacity="0.13"/>
    </pattern>
    <linearGradient id="ventana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fondo)"/>
  <rect width="800" height="600" fill="url(#puntos)"/>
  <circle cx="700" cy="90" r="155" fill="#ffffff" opacity="0.07"/>
  <circle cx="95" cy="545" r="185" fill="#ffffff" opacity="0.06"/>
  <rect x="150" y="115" width="500" height="360" rx="24" fill="url(#ventana)"/>
  <rect x="150" y="115" width="500" height="58" rx="24" fill="#d5e2ff"/>
  <rect x="150" y="150" width="500" height="23" fill="#d5e2ff"/>
  <circle cx="190" cy="144" r="8" fill="#ff6b6b"/>
  <circle cx="218" cy="144" r="8" fill="#ffd166"/>
  <circle cx="246" cy="144" r="8" fill="#2dd4bf"/>
  <g font-family="Consolas, monospace" font-size="24" font-weight="700">
    <text x="200" y="245" fill="#2563eb">&lt;section</text>
    <text x="200" y="288" fill="#7c3aed">class=</text>
    <text x="325" y="288" fill="#0f9f6e">"catalogo"</text>
    <text x="485" y="288" fill="#2563eb">&gt;</text>
    <text x="245" y="331" fill="#64748b">// datos y presentación</text>
    <text x="245" y="374" fill="#2563eb">&lt;/section&gt;</text>
  </g>
  <g fill="#ffffff" opacity="0.42" font-family="Consolas, monospace" font-size="62" font-weight="700">
